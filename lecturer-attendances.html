<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lecturer Attendances | Academic System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="assets/style.css" rel="stylesheet">
</head>
<body>
  <div id="app"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script src="assets/app.js"></script>
  <script>
crud({
  page: 'attendance', title: 'Lecturer Attendances', table: 'lecturer_attendances', order: 'attendance_date', asc: false,
  exportName: 'lecturer-attendances', nameKey: 'course_name',
  columns: ['attendance_date', 'lecturer_id', 'course_name', 'batch', 'semester', 'meeting', 'attendance_status'],
  filters: [{ key: 'batch', label: 'Batch' }, { key: 'semester', label: 'Semester' }],
  fields: [
    { key: 'lecturer_id', label: 'Lecturer', type: 'lookup', ref: { table: 'lecturers', label: 'full_name' }, required: true },
    { key: 'course_name', label: 'Course', required: true },
    { key: 'batch', label: 'Batch', max: 20 },
    { key: 'semester', label: 'Semester', max: 10 },
    { key: 'meeting', label: 'Meeting', type: 'number' },
    { key: 'attendance_date', label: 'Date', type: 'date' },
    { key: 'attendance_status', label: 'Attendance Status', type: 'select', default: 'Present',
      options: [['Present', 'Present'], ['Absent', 'Absent'], ['Permission', 'Permission'], ['Sick', 'Sick']] },
  ],
});
  </script>
</body>
</html>
