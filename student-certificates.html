<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Certificates | Academic System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="assets/style.css" rel="stylesheet">
</head>
<body>
  <div id="app"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script src="assets/app.js"></script>
  <script>
crud({
  page: 'sertifikat', title: 'Student Certificates', table: 'student_certificates', order: 'issue_date', asc: false,
  exportName: 'student-certificates', nameKey: 'certificate_name',
  columns: ['student_id', 'batch', 'certificate_name', 'issue_date', 'certificate_url'],
  filters: [{ key: 'batch', label: 'Batch' }],
  fields: [
    { key: 'student_id', label: 'Student', type: 'lookup', ref: { table: 'students', label: 'full_name', sub: 'student_id' }, required: true },
    { key: 'batch', label: 'Batch', max: 20 },
    { key: 'certificate_name', label: 'Certificate Name', required: true },
    { key: 'issue_date', label: 'Issue Date', type: 'date' },
    { key: 'certificate_url', label: 'Certificate URL', type: 'url', wide: true },
  ],
});
  </script>
</body>
</html>
