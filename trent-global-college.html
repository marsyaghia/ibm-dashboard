<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trent Global College | Academic System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="assets/style.css" rel="stylesheet">
</head>
<body>
  <div id="app"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script src="assets/app.js"></script>
  <script>
crud({
  page: 'trent', title: 'Trent Global College', table: 'trent_global_courses', order: 'course_name',
  exportName: 'trent-global-college', nameKey: 'course_name',
  columns: ['course_name', 'batch', 'semester', 'study_plan_url', 'assessment_url'],
  filters: [{ key: 'batch', label: 'Batch' }, { key: 'semester', label: 'Semester' }],
  fields: [
    { key: 'course_name', label: 'Subject', required: true },
    { key: 'batch', label: 'Batch', max: 20 },
    { key: 'semester', label: 'Semester', max: 10 },
    { key: 'study_plan_url', label: 'URL Study Plan', type: 'url' },
    { key: 'assessment_url', label: 'URL Assessment', type: 'url' },
  ],
});
  </script>
</body>
</html>
